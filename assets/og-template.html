<!doctype html>
<!-- Source for assets/img/og-image.jpg (1200×630 social preview). Not linked from the site. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG image template</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@500;700&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    background: #f3eee4; color: #1b1a17; font-family: "Figtree", sans-serif;
  }
  .copy { position: absolute; left: 80px; top: 92px; width: 620px; }
  .kicker { display: flex; align-items: center; gap: 14px; font-weight: 700; font-size: 19px; letter-spacing: .14em; text-transform: uppercase; color: #4a453d; }
  .kicker::before { content: ""; width: 14px; height: 14px; border-radius: 3px; background: #c2410c; }
  h1 { margin: 34px 0 0; font: 700 124px/0.98 "Bricolage Grotesque", sans-serif; letter-spacing: -.03em; }
  h1 em { font-style: normal; color: #fbf5ea; background: #b53d0c; padding: 0 .08em; border-radius: .06em; }
  p { margin: 34px 0 0; font-size: 29px; line-height: 1.35; font-weight: 500; color: #4a453d; }
  .rule { position: absolute; left: 80px; right: 80px; bottom: 64px; border-top: 3px solid #1b1a17; }
  .photo { position: absolute; right: 94px; top: 64px; width: 360px; height: 450px; border: 3px solid #1b1a17; border-radius: 24px; overflow: hidden; box-shadow: 16px 16px 0 #c2410c; }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .bbox { position: absolute; left: 33.5%; top: 7.5%; width: 32%; height: 31%; border: 3px solid #ff701f; border-radius: 3px; }
  .bbox span { position: absolute; left: -3px; bottom: 100%; background: #ff701f; color: #1b1a17; font: 700 14px/1 ui-monospace, Menlo, monospace; padding: 6px 8px 5px; border-radius: 3px 3px 0 0; white-space: nowrap; }
</style>
</head>
<body>
  <div class="copy">
    <div class="kicker">Lahore, Pakistan</div>
    <h1>Ali Haider, <em>AI&nbsp;Engineer</em></h1>
    <p>Production computer vision, generative AI and agentic systems.</p>
  </div>
  <div class="photo">
    <img src="img/ali-haider.jpg" alt="">
    <div class="bbox"><span>ai_engineer 0.98</span></div>
  </div>
  <div class="rule"></div>
</body>
</html>
